# CI (V2, decisions #41): unit tests every push/PR; assemble gated on tags.
#
# Two lanes map cleanly onto the repo's tooling split:
#   jvm-tests      — pure-JVM modules, no Android SDK needed (fast path).
#   android-build  — Android modules inside the baked toolchain image
#                    (tools/docker-build.sh, `docker build -t ayvu-android .`);
#                    builds the app + androidTest APKs and runs every module's
#                    unit tests. Instrumented tests need a connected device and
#                    stay manual (S22 staging workflow in build.md).
#   assemble-on-tag — the roadmap's "assemble on tag" gate after both lanes.

name: ci

on:
  push:
    branches: [main]
    # Version tags MUST be listed here or `assemble-on-tag` can never run: its
    # `if: startsWith(github.ref, 'refs/tags/')` is only reachable if a tag push
    # starts the workflow at all, and `branches` alone never matches a tag ref.
    # Pack tags (espeak-ng-*, translate-*) stay out — they ship no app artifact.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Pure-JVM module tests (no Android SDK)
        run: |
          ./gradlew --no-daemon \
            :core-model:test :core-ebook:test :core-locate:test \
            :core-tts:test :core-translate:test :core-player:test \
            :core-ocr:test :core-backup:test
      - name: Architecture guard (feature-* never depend on feature-*)
        run: ./gradlew --no-daemon checkFeatureBoundaries
      - name: ktlint (no baseline — a violation fails)
        run: ./gradlew --no-daemon ktlintCheck

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `build/llama.cpp-src` is gitignored and materialized by this script; the
      # Android build aborts without it (core-llm's CMakeLists FATAL_ERRORs on the
      # missing vendored tree — that is what kept this lane red since #162).
      - name: Fetch the vendored llama.cpp (pinned revision)
        run: tools/fetch-llama-cpp.sh
      - name: Build the Android toolchain image
        run: docker build -t ayvu-android .
      - name: Assemble both APKs + every Android unit test (Docker)
        run: |
          tools/docker-build.sh \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest :core-persistence:testDebugUnitTest \
            :core-ui:testDebugUnitTest \
            :feature-settings:testDebugUnitTest :feature-share:testDebugUnitTest \
            :feature-player:testDebugUnitTest :feature-library:testDebugUnitTest

  assemble-on-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [jvm-tests, android-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the vendored llama.cpp (pinned revision)
        run: tools/fetch-llama-cpp.sh
      - name: Build the Android toolchain image
        run: docker build -t ayvu-android .
      - name: Debug + release assemble gate
        run: tools/docker-build.sh :app:assembleDebug :app:assembleRelease